<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ランダム図鑑：番号＋日本語名（PokeAPI）</title>

  <style>
    :root {
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #fff7fb;
      color: #222;
      font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        Roboto,
        "Hiragino Kaku Gothic ProN",
        "Noto Sans JP",
        "Yu Gothic",
        "Meiryo",
        Arial,
        sans-serif;
    }

    .card {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 22px;
      background: #fff;
      border: 1px solid #f2e2ee;
      border-radius: var(--radius);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.25rem;
      letter-spacing: 0.02em;
    }

    .lead {
      margin: 0 0 18px;
      color: #555;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    button {
      appearance: none;
      padding: 12px 18px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffd9ec, #ffb6da);
      box-shadow: 0 8px 16px rgba(255, 73, 143, 0.18);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      transition:
        transform 0.1s ease,
        opacity 0.1s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .result {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 10px 16px;
      min-height: 64px;
      padding-top: 14px;
      border-top: 1px dashed #f0d3e7;
    }

    .label {
      color: #8a5a74;
      font-weight: 700;
    }

    .value {
      font-size: 1.15rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .muted {
      color: #777;
      font-size: 0.9rem;
    }

    .error {
      color: #b00020;
      font-weight: 700;
    }

    footer {
      margin-top: 20px;
      color: #777;
      font-size: 0.85rem;
    }

    code {
      padding: 2px 6px;
      background: #fff0f6;
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>ランダム図鑑（番号＋日本語名）</h1>

    <p class="lead">
      ボタンを押すと、PokeAPIからランダムに1種を取得して
      「全国図鑑番号」と「日本語名」を表示します。
    </p>

    <div class="controls">
      <button id="drawBtn" type="button">
        ランダムに引く
      </button>

      <span id="hint" class="muted">
        （通信が発生します）
      </span>
    </div>

    <div id="result" class="result" aria-live="polite">
      <div class="label">番号</div>
      <div id="dexNo" class="value">—</div>

      <div class="label">名前</div>
      <div id="nameJa" class="value">—</div>
    </div>

    <footer>
      データ提供：
      <a
        href="https://pokeapi.co/"
        target="_blank"
        rel="noopener noreferrer"
      >
        PokeAPI
      </a>
      。
      日本語名は
      <code>pokemon-species</code>
      の
      <code>names</code>
      を参照します。
    </footer>
  </main>

  <script>
    (() => {
      const API_BASE = "https://pokeapi.co/api/v2";
      const REQUEST_TIMEOUT = 10000;

      const btn = document.getElementById("drawBtn");
      const dexEl = document.getElementById("dexNo");
      const nameEl = document.getElementById("nameJa");
      const hint = document.getElementById("hint");

      let totalSpecies = null;
      let activeController = null;

      /**
       * タイムアウト付きでJSONを取得する
       */
      async function fetchJSON(url, controller) {
        const timeoutId = setTimeout(() => {
          controller.abort();
        }, REQUEST_TIMEOUT);

        try {
          const response = await fetch(url, {
            signal: controller.signal,
            cache: "no-store"
          });

          if (!response.ok) {
            throw new Error(`通信エラー（HTTP ${response.status}）`);
          }

          return await response.json();
        } finally {
          clearTimeout(timeoutId);
        }
      }

      /**
       * PokeAPIに登録されているpokemon-speciesの総数を取得
       *
       * limit=0は使用せず、limit=1でcountだけ取得する。
       */
      async function getTotalSpeciesCount(controller) {
        if (Number.isInteger(totalSpecies) && totalSpecies > 0) {
          return totalSpecies;
        }

        const data = await fetchJSON(
          `${API_BASE}/pokemon-species?limit=1`,
          controller
        );

        const count = Number(data.count);

        if (!Number.isInteger(count) || count <= 0) {
          throw new Error("ポケモン総数を取得できませんでした");
        }

        totalSpecies = count;
        return count;
      }

      function pad4(number) {
        return String(number).padStart(4, "0");
      }

      function getJapaneseName(species) {
        const names = Array.isArray(species.names)
          ? species.names
          : [];

        const priorities = [
          "ja-Hrkt",
          "ja",
          "en"
        ];

        for (const languageName of priorities) {
          const entry = names.find((item) => {
            return item.language?.name === languageName;
          });

          if (entry?.name) {
            return entry.name;
          }
        }

        return species.name || "名称不明";
      }

      function showLoading() {
        btn.disabled = true;
        btn.textContent = "取得中…";
        hint.textContent = "PokeAPIから取得しています…";
      }

      function finishLoading() {
        btn.disabled = false;
        btn.textContent = "ランダムに引く";
      }

      async function drawRandom() {
        if (activeController) {
          activeController.abort();
        }

        const controller = new AbortController();
        activeController = controller;

        showLoading();

        try {
          const count = await getTotalSpeciesCount(controller);

          // offsetは0〜count-1
          const offset = Math.floor(Math.random() * count);

          const listData = await fetchJSON(
            `${API_BASE}/pokemon-species?limit=1&offset=${offset}`,
            controller
          );

          const speciesUrl = listData.results?.[0]?.url;

          if (!speciesUrl) {
            throw new Error("ポケモンデータが見つかりませんでした");
          }

          const species = await fetchJSON(
            speciesUrl,
            controller
          );

          const id = Number(species.id);

          if (!Number.isInteger(id)) {
            throw new Error("図鑑番号を取得できませんでした");
          }

          dexEl.textContent = `No.${pad4(id)}`;
          nameEl.textContent = getJapaneseName(species);

          hint.textContent =
            `全${count}種からランダムに取得しました。`;
        } catch (error) {
          if (error.name === "AbortError") {
            dexEl.textContent = "—";
            nameEl.textContent = "通信がタイムアウトしました";
            nameEl.classList.add("error");
            hint.textContent = "時間を置いてもう一度お試しください。";
            return;
          }

          console.error(error);

          dexEl.textContent = "—";
          nameEl.textContent =
            `エラー：${error.message || "取得に失敗しました"}`;
          nameEl.classList.add("error");

          hint.textContent = "もう一度お試しください。";
        } finally {
          if (activeController === controller) {
            activeController = null;
            finishLoading();
          }
        }
      }

      btn.addEventListener("click", () => {
        nameEl.classList.remove("error");
        drawRandom();
      });
    })();
  </script>
</body>
</html>
